# cursorkit profile user patch layer: insert the host plugin, override agent-loop config.
- insert:
    - id: cursorkit-host
      name: '@dsh-cursorkit/host-dsh'
      inject: [sessions, agents, agentLoop, approval]
      config:
        port: 0
        tokenFile: '$DSH_HOME/.cursorkit/runtime.json'

- id: agent-loop
  config:
    agents:
      - id: demo-agent
        sessionId: session-demo
        cwd: /tmp/demo
        provider: wps
        model: deepseek/deepseek-v4-flash-0731
